name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out the application
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile the Python sources
        run: python -m compileall -q pm3manager tests scripts

      - name: Run the automated tests
        run: python -m pytest tests

      # This job does not flash firmware, upload artifacts, or expect ProxSpace
      # or a Proxmark3 to be present. Tests that need the local laboratory
      # checkout skip themselves when that checkout is absent.