name: CI

# checkout@v7 and setup-python@v7 both declare runs.using: node24.
# GitHub-hosted windows-latest already meets the runner minimum (2.327.1).
# Python stays 3.11. The token can only read this repository.
# This job does not flash, upload artifacts, or publish packages.
# Tests that need a local ProxSpace checkout skip themselves.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out the application
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile the Python sources
        run: python -m compileall -q pm3manager tests scripts

      - name: Run the automated tests
        run: python -m pytest tests
